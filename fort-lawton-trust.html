(function(){
  var LSK='tbc_v_flt';
  function tryPw(){
    var inp=document.getElementById('pw-input');
    tbcPageUnlock(TBC_ENC,inp.value,LSK).then(function(ok){
      if(!ok){ document.getElementById('pw-error').style.display='block'; inp.value=''; inp.focus(); }

})();
