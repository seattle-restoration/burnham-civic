(function(){
  var LSK='tbc_v_viva';
  function tryPw(){
    var inp=document.getElementById('pw-input');
    tbcPageUnlock(TBC_ENC,inp.value,LSK).then(function(ok){
      if(!ok){ document.getElementById('pw-error').style.display='block'; inp.value=''; inp.focus(); }
    });
  }
  document.getElementById('pw-submit').addEventListener('click',tryPw);
  document.getElementById('pw-input').addEventListener('keydown',function(e){if(e.key==='Enter')tryPw();});
  setTimeout(function(){document.getElementById('pw-input').focus();},100);
  var saved=null; try{saved=localStorage.getItem(LSK);}catch(e){}
  if(saved){tbcPageUnlock(TBC_ENC,saved,LSK);}
})();
</script>
